name: Build and upload to PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - develop
jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-latest is Apple Silicon (arm64); the old Intel runner
        # (macos-13) is retired. One arm64 runner is enough - a second would
        # just rebuild the identical macosx_*_arm64 wheel.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: ./accelerate

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist and pure-Python wheel
        # The root PyVRML97 package has no C extensions, so a single
        # py3-none-any wheel works everywhere. Building it (rather than only the
        # sdist) means `pip install PyVRML97` gets a wheel instead of building
        # from source. `build` with no flags produces both the sdist and wheel.
        run: pipx run build

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist-root
          path: dist/*

  build_sdist_accel:
    name: Build accelerate source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Build accelerate sdist
        run: pipx run build --sdist
        working-directory: ./accelerate/

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist-accel
          path: dist/*.tar.gz

  upload_pypi_test:
    needs: [build_wheels, build_sdist, build_sdist_accel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # only push to pypi if we are pushing to master
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/develop')
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Skip files already on PyPI so a re-run doesn't 400 the whole job on a
          # single conflicting file. (Does not bypass PyPI's ">14 days" rule for
          # genuinely new files added to an old release.)
          skip-existing: true

  upload_pypi:
    needs: [build_wheels, build_sdist, build_sdist_accel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # only push to pypi if we are pushing a tag with version prefix
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/master')
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Skip files already on PyPI so a re-run doesn't 400 the whole job on a
          # single conflicting file. (Does not bypass PyPI's ">14 days" rule for
          # genuinely new files added to an old release.)
          skip-existing: true
        # repository-url: https://test.pypi.org/legacy/
