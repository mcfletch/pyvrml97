name: Build and upload to PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-latest is Apple Silicon (arm64); the old Intel runner
        # (macos-13) is retired. One arm64 runner is enough - a second would
        # just rebuild the identical macosx_*_arm64 wheel.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: ./accelerate

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist and pure-Python wheel
        # The root PyVRML97 package has no C extensions, so a single
        # py3-none-any wheel works everywhere. Building it (rather than only the
        # sdist) means `pip install PyVRML97` gets a wheel instead of building
        # from source. `build` with no flags produces both the sdist and wheel.
        run: pipx run build

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist-root
          path: dist/*

  build_sdist_accel:
    name: Build accelerate source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Build accelerate sdist
        run: pipx run build --sdist
        working-directory: ./accelerate/

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist-accel
          path: dist/*.tar.gz

  upload_pypi_test:
    needs: [build_wheels, build_sdist, build_sdist_accel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # only push to pypi if we are pushing to master
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/develop')
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Skip files already on PyPI so a re-run doesn't 400 the whole job on a
          # single conflicting file. (Does not bypass PyPI's ">14 days" rule for
          # genuinely new files added to an old release.)
          skip-existing: true

  # Whether there is anything to publish. Asked before the upload rather than
  # left to PyPI to reject, so a push that does not bump the version is an
  # ordinary build rather than an upload nobody reads the result of.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        name: Is this version already on PyPI?
        run: |
          VERSION=$(python -c "import re,pathlib,sys; t=pathlib.Path('vrml/__init__.py').read_text(); m=re.search(r'^__version__\s*=\s*[\'\"]([^\'\"]+)', t, re.M); sys.exit('no __version__ in vrml/__init__.py') if not m else print(m.group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PUBLISH=false
          for DIST in PyVRML97 PyVRML97-accelerate; do
            # Only 200 and 404 are answers. Anything else -- a 5xx, a timeout, a
            # DNS failure -- means PyPI did not tell us, and guessing "not
            # published" would turn an outage into an upload against a version
            # that cannot be replaced.
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
                   "https://pypi.org/pypi/$DIST/$VERSION/json" || echo 000)
            case "$CODE" in
              200) echo "$DIST $VERSION is already on PyPI." ;;
              404) echo "$DIST $VERSION is not on PyPI; it will be published."; PUBLISH=true ;;
              *)   echo "PyPI answered HTTP $CODE for $DIST $VERSION; refusing to guess."; exit 1 ;;
            esac
          done
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  upload_pypi:
    needs: [build_wheels, build_sdist, build_sdist_accel, version]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # Only from the release branch, and only a version that is not out yet.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        && needs.version.outputs.publish == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Skip files already on PyPI so a re-run doesn't 400 the whole job on a
          # single conflicting file. (Does not bypass PyPI's ">14 days" rule for
          # genuinely new files added to an old release.)
          skip-existing: true
        # repository-url: https://test.pypi.org/legacy/
