[tox]
# Every interpreter `requires-python = ">=3.9"` admits; 3.8 was listed and
# is below the floor, so its environment could never build the package.
# Each is run twice: without the Cython accelerator and with it, because
# the pure-Python field and the compiled one have to behave the same.
envlist=
    typecheck
    py{313,312,311,310,39}-accel{0,1}
skip_missing_interpreters=True
[testenv]
usedevelop=True
passenv=DISPLAY
deps=
    -r{toxinidir}/test-requirements.txt
    # tox keys a dependency on how it is written, not on what it contains, so
    # an `accel1` environment built before a change to `accelerate/src/*.pyx`
    # keeps the extension it already compiled. Run `tox -r` after editing the
    # Cython, or the accelerated environments test the previous build and
    # report a fix as still broken.
    accel1: {toxinidir}/accelerate
commands=
    pytest -sv {posargs}


[testenv:typecheck]
# No install: `[tool.mypy] files` names `vrml` in the source tree, and reading
# it there is what a checker does anyway. It also settles which `BaseField` is
# described -- the pure-Python one in `vrml/field.py` rather than the compiled
# class that replaces it at run time, which is the one whose declarations a
# consumer's checker reads.
skip_install = true
deps =
    mypy
    numpy>=2.0.1
commands = mypy
